id = "haas-mill"
label = "Haas milling (Fanuc-compatible ISO)"
block_number = "N"
comment = [";", "()"]
program_delimiters = ["%"]
axes = ["X", "Y", "Z", "A", "B", "C"]
arc_ijk = true
arc_r = true
tool_word = "T"
length_comp = "H"
radius_comp = "D"
feed = "F"
spindle = "S"
incremental = "G91"
absolute = "G90"
planes = { G17 = "XY", G18 = "ZX", G19 = "YZ" }
toolchange_patterns = ["T{num}", "M06"]
