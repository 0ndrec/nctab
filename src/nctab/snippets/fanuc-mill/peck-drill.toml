id = "peck-drill"
title = "Peck drilling G83"
description = "Deep-hole drilling with chip breaking."
profile = "fanuc-mill"
body = """
G99 G83 Z{Z} Q{Q} R{R} F{F}
G80
"""

[[fields]]
name = "Z"
label = "Depth"
type = "float"
default = -30.0

[[fields]]
name = "Q"
label = "Peck depth"
type = "float"
min = 0.01
default = 3.0

[[fields]]
name = "R"
label = "Retract plane"
type = "float"
default = 2.0

[[fields]]
name = "F"
label = "Feed"
type = "int"
min = 1
default = 120
